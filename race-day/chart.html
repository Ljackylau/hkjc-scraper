<!doctype html>
<html lang="zh-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragon FCT 即時圖表</title>
<style>
:root{color-scheme:dark}body{font:15px system-ui;background:#09111f;color:#eef4ff;margin:0;padding:20px}main{max-width:1400px;margin:auto}
header,.race{background:#121f34;border:1px solid #2d405e;border-radius:16px;padding:18px;margin-bottom:18px}
h1{margin:0 0 8px}.muted{color:#aab9ce}.warn{color:#ffc566}.ok{color:#79dfa8}.layout{display:grid;grid-template-columns:minmax(600px,1fr) 310px;gap:18px}.chart{overflow:auto}
svg{width:100%;min-width:600px}text{fill:#b9c8dd;font-size:12px}.snapshots{display:grid;gap:10px;align-content:start}.shot{background:#0b1728;border:1px solid #344d70;border-radius:12px;padding:12px}
button{border:0;border-radius:9px;padding:9px 12px;margin:0 7px 7px 0;background:#f5a04c;color:#111;font-weight:700;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}
.rank{font-size:18px;margin:7px 0}.score{color:#ffc566;font-weight:700}details{margin-top:10px}.empty{padding:80px 20px;text-align:center;color:#aab9ce}
@media(max-width:900px){.layout{grid-template-columns:1fr}.snapshots{grid-template-columns:1fr 1fr}}
</style>
<main><header><h1>Dragon｜FCT 即時市場訊號</h1>
<div class="muted">每分鐘收集；點＝跌幅 &gt;30% FCT 組合嘅平均跌幅。金色＝目前最高三匹。分數唔係入位機率。</div>
<p id="health">正在載入上次資料…</p></header><div id="app"></div></main>
<script>
const args=new URLSearchParams(location.search); const date=args.get('date')||'2026-09-13';const phase=args.get('phase')==='late'?'late':'early';
const RAW=ref=>`https://raw.githubusercontent.com/Ljackylau/hkjc-scraper/${ref}/race-day-data/${date}/${phase}/dragon/results.json`;
const STATE_KEY='dragon-fct-last-state-v4';
const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stamp=x=>x?new Date(x).toLocaleString('zh-HK',{timeZone:'Asia/Hong_Kong',hour12:false}):'未有';
let latest=read(STATE_KEY,null), dataRef='',refChecked=0;
async function currentRef(){
 if(dataRef&&Date.now()-refChecked<55000)return dataRef;
 try{const r=await fetch(`https://api.github.com/repos/Ljackylau/hkjc-scraper/branches/race-day-data?t=${Math.floor(Date.now()/55000)}`,{cache:'no-store',signal:AbortSignal.timeout(12000)});
  if(!r.ok)throw Error('GitHub API '+r.status);dataRef=(await r.json()).commit.sha;refChecked=Date.now()
 }catch(e){if(!dataRef)throw e}
 return dataRef
}
function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function fct(r){return (r.pools||[]).find(p=>p.pool==='FCT')}
function top3(p){return [...(p?.horses||[])].sort((a,b)=>b.avg_drop_pct-a.avg_drop_pct||b.count-a.count||a.horse-b.horse).slice(0,3)}
function shotCard(s,r,label){
 const z=(r.snapshots||{})[label];
 if(!z)return '<div class="shot"><b>'+label+' 自動快照</b><p class="muted">等候指定時間自動保存</p></div>';
 return '<div class="shot"><b>'+label+' 自動快照</b><div class="muted">目標 '+esc(stamp(z.target_time))+'｜實際 '+esc(stamp(z.captured))+'｜來源 '+esc(stamp(z.source_updated))+'</div>'+
 (z.top3.length?z.top3.map((h,i)=>'<div class="rank">'+(i+1)+'. '+h.horse+'號 <span class="score">'+Number(h.score).toFixed(2)+'%</span></div>').join(''):'<p class="muted">當時冇符合門檻嘅 FCT 訊號</p>')+'</div>';
}
function raceHTML(s,r){
 const p=fct(r),hs=r.horse_numbers||[],rank=top3(p),leaders=new Set(rank.map(h=>h.horse)),scores=Object.fromEntries((p?.horses||[]).map(h=>[h.horse,h]));
 const max=Math.max(35,...Object.values(scores).map(h=>h.avg_drop_pct));let svg='<svg viewBox="0 0 980 350" role="img" aria-label="R'+r.race+' FCT 平均跌幅">';
 for(let i=0;i<=4;i++){const pct=max*i/4,y=280-pct/max*220;svg+='<path d="M55 '+y+'H940" stroke="#2d405e"/><text x="10" y="'+(y+4)+'">'+pct.toFixed(1)+'%</text>'}
 hs.forEach((h,i)=>{const x=70+(i+.5)*850/Math.max(1,hs.length),a=scores[h],y=a?280-a.avg_drop_pct/max*220:280;
   svg+='<text x="'+x+'" y="310" text-anchor="middle">'+h+'</text>';
   if(a)svg+='<path d="M'+x+' 280V'+y+'" stroke="#f5a04c" stroke-width="3"/><circle cx="'+x+'" cy="'+y+'" r="'+(leaders.has(h)?9:6)+'" fill="'+(leaders.has(h)?'#ffd15c':'#f5a04c')+'"><title>'+h+'號：'+a.avg_drop_pct+'%｜'+a.count+'個組合</title></circle><text x="'+x+'" y="'+(y-13)+'" text-anchor="middle">'+a.avg_drop_pct.toFixed(1)+'</text>';
 });svg+='<text x="480" y="340" text-anchor="middle">馬號</text></svg>';
 const meta=p?'FCT｜基準 '+stamp(p.baseline_time)+'｜取樣 '+stamp(p.final_time)+'｜來源 '+stamp(p.source_updated)+'｜'+p.compared_pairs+' 組可比較'+(p.fresh===false?'｜來源過期':''):'暫未取得 FCT';
 return '<section class="race"><h2>R'+r.race+' · '+esc(r.status)+'</h2><p class="'+(p?.fresh===false?'warn':'muted')+'">'+esc(meta)+'</p>'+
 '<div class="layout"><div class="chart">'+(hs.length?svg:'<div class="empty">暫時冇 FCT 數據</div>')+'</div><aside class="snapshots">'+shotCard(s,r,'T−10')+shotCard(s,r,'T−3')+'</aside></div>'+
 (p?'<details><summary>最新 FCT 賠率（'+Object.keys(p.current_odds||{}).length+' 組）</summary><p class="muted">'+Object.entries(p.current_odds||{}).map(([k,v])=>esc(k)+'：'+esc(v)).join('　·　')+'</p></details>':'')+'</section>';
}
function render(s){document.querySelector('#app').innerHTML=s.races.map(r=>raceHTML(s,r)).join('')}
async function fetchJSON(url,headers={}){const r=await fetch(url,{cache:'no-store',headers,signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.races)||!Date.parse(d.published_at))throw Error('數據格式錯誤');return d}
async function tick(){
 let error='';try{const ref=await currentRef();let s=await fetchJSON(RAW(ref));
  if(!latest||Date.parse(s.published_at)>=Date.parse(latest.published_at)){latest=s;write(STATE_KEY,s)}
 }catch(e){error='｜讀取失敗 '+e.message}
 const h=document.querySelector('#health');if(latest){render(latest);const age=Math.max(0,Math.floor((Date.now()-Date.parse(latest.published_at))/1000));h.className=age>120||error?'warn':'ok';h.textContent='賽日 '+latest.date+' '+latest.venue+'｜最後發布 '+stamp(latest.published_at)+'｜距今 '+age+' 秒｜'+(age>120?'資料已延遲；保留最後成功畫面':'即時資料正常')+error}else{h.className='warn';h.textContent='未有可顯示資料'+error}
 setTimeout(tick,5000)
}
if(latest)render(latest);tick();
</script></html>
