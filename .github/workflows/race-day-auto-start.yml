name: Race Day Automatic Start
on:
  schedule:
    # UTC 01..11 = HK 09..19. Off-hour offsets reduce busy-hour queueing.
    - cron: '7,22,37,52 1-11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inspect only; do not start Runner or send notifications'
        type: boolean
        default: true
permissions:
  contents: read
  actions: write
concurrency:
  group: race-day-auto-start-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install certifi 'lxml>=5,<7'
      - run: python -m unittest discover -s race-day -p 'test_auto_start.py' -v
      - name: Check today's meeting and submit Runner once
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python race-day/auto_start.py --dry-run
          else
            python race-day/auto_start.py
          fi
