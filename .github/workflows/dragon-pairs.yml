name: Dragon T60-T10 Pair Drops
on:
  workflow_dispatch:
  push:
    paths: ['dragon/meeting.json', '.github/workflows/dragon-pairs.yml']
permissions:
  contents: write
concurrency:
  group: dragon-pair-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s dragon -p 'test_*.py' -v
      - run: pip install 'playwright>=1.45,<2'
      - run: python -m playwright install --with-deps chromium
      - name: Configure result commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Collect and publish each race
        run: python dragon/collector.py --push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dragon-audit-${{ github.run_id }}
          path: |
            dragon/raw-*.jsonl
            dragon/results.json
            dragon/RESULTS.md
            dragon/chart.html

