name: Race Day Official Settlement
on:
  schedule:
    - cron: '30 16 * * *' # 00:30 Hong Kong time; check yesterday's meeting
  workflow_dispatch:
    inputs:
      date:
        description: 'Hong Kong race date (YYYY-MM-DD); blank = yesterday'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: race-day-settlement
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          ref: race-day-data
          path: data
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconcile official results and dividends
        env:
          RACE_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$RACE_DATE" ]; then
            python source/race-day/reconcile.py --date "$RACE_DATE" --data-root data/race-day-data
          else
            for DAYS_BACK in 1 2 3; do
              TARGET_DATE=$(TZ=Asia/Hong_Kong date -d "$DAYS_BACK day ago" +%F)
              python source/race-day/reconcile.py --date "$TARGET_DATE" --data-root data/race-day-data
            done
          fi
      - name: Publish reconciled records
        run: |
          cd data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add race-day-data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Reconcile official race dividends [skip ci]'
          git push origin HEAD:race-day-data
