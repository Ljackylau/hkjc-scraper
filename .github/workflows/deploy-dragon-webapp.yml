name: Deploy Dragon Web App
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["dragon-webapp/**", ".github/workflows/deploy-dragon-webapp.yml"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dragon-webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npx wrangler d1 migrations apply dragon-racing-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
