name: Race Day Runner (Independent)
run-name: "Race Day ${{ inputs.date || 'checks' }} · ${{ inputs.mode || 'Checks' }} · ${{ inputs.venue || '' }}"
on:
  push:
    branches: [main]
    paths: ['race-day/**', '.github/workflows/race-day-combined.yml']
  workflow_dispatch:
    inputs:
      date:
        description: 'Hong Kong race date'
        required: true
        default: ''
      mode:
        description: 'Preflight today; Run on race day'
        type: choice
        options: [Preflight, Run]
        default: Preflight
      venue:
        description: 'Independent HKJC shadow: venue'
        required: true
        default: HV
        type: choice
        options: [HV, ST]
      post_times:
        description: 'All official race times in order, comma separated; match date and venue'
        required: true
        default: ''
permissions:
  contents: write
concurrency:
  group: race-day-independent
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'lxml>=5,<7'
      - run: python -m unittest discover -s race-day -p 'test_*.py' -v
      - name: Check shared cold policy in browser
        run: |
          node --check race-day/cold-signal.js
          node race-day/test_cold_receipt.js
          node race-day/test_cold_groups.js
          node --check race-day/live-tips.js
          node race-day/test_live_tips.js
          node --check race-day/leg-selection.js
          node race-day/test_leg_fusion.js
          node --check race-day/track-bias.js
          node --check race-day/track-bias-page.js
          node race-day/test_track_bias.js
          node race-day/test_track_bias_page.js
          node --check race-day/pick-images.js
          node --check race-day/pick-images-page.js
          node race-day/test_pick_images.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          page=Path('race-day/index.html').read_text()
          script=re.findall(r'<script>([\s\S]*?)</script>',page)[-1]
          subprocess.run(['node','--check'],input=script,text=True,check=True)
          PY
      - name: Check Horse103 connectivity and response schema
        env:
          RACE_DATE: ${{ inputs.date }}
        run: |
          RACE_DATE=${RACE_DATE:-$(TZ=Asia/Hong_Kong date +%F)}
          python race-day/resilience.py health --date "$RACE_DATE" --output race-day/source-health.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horse103-source-health
          path: race-day/source-health.json
          retention-days: 7
      - id: plan
        if: github.event_name == 'workflow_dispatch'
        env:
          RACE_DATE: ${{ inputs.date }}
        run: |
          RACE_DATE=${RACE_DATE:-$(TZ=Asia/Hong_Kong date +%F)}
          python race-day/runner.py --date "$RACE_DATE" --plan
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: race-day-plan
          path: race-day/plan.json
          retention-days: 1
  early:
    needs: prepare
    if: inputs.mode == 'Run'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: race-day-plan
          path: race-day
      - run: pip install 'playwright>=1.45,<2' certifi 'lxml>=5,<7'
      - run: python -m playwright install --with-deps chromium
      - env:
          RACE_DATE: ${{ inputs.date }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u race-day/runner.py --date "$RACE_DATE" --phase early --push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horse103-early-${{ inputs.date }}-${{ github.run_id }}
          path: |
            race-day-data/${{ inputs.date }}/early/horse103/
            race-day-data/${{ inputs.date }}/early/results/
            race-day-data/${{ inputs.date }}/early/notifications/
            race-day-data/${{ inputs.date }}/early/status.json
            race-day/plan.json
          retention-days: 7
  release-late:
    needs: prepare
    if: inputs.mode == 'Run'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - env:
          RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          python3 - <<'PY'
          import os,time
          from datetime import datetime,timezone
          target=datetime.fromisoformat(os.environ['RELEASE'])
          while datetime.now(timezone.utc)<target:
              time.sleep(min(30,(target-datetime.now(timezone.utc)).total_seconds()))
          PY
  late:
    needs: [prepare, release-late]
    if: inputs.mode == 'Run'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: race-day-plan
          path: race-day
      - run: pip install 'playwright>=1.45,<2' certifi 'lxml>=5,<7'
      - run: python -m playwright install --with-deps chromium
      - env:
          RACE_DATE: ${{ inputs.date }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u race-day/runner.py --date "$RACE_DATE" --phase late --push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horse103-late-${{ inputs.date }}-${{ github.run_id }}
          path: |
            race-day-data/${{ inputs.date }}/late/horse103/
            race-day-data/${{ inputs.date }}/late/results/
            race-day-data/${{ inputs.date }}/late/notifications/
            race-day-data/${{ inputs.date }}/late/status.json
            race-day/plan.json
          retention-days: 7
  hkjc-early:
    if: inputs.mode == 'Run'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'playwright>=1.45,<2' certifi 'lxml>=5,<7'
      - run: python -m playwright install --with-deps chromium
      - name: Capture HKJC quotes and send independent T-3 tips
        env:
          RACE_DATE: ${{ inputs.date }}
          VENUE: ${{ inputs.venue }}
          POST_TIMES: ${{ inputs.post_times }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u race-day/hkjc_shadow.py --date "$RACE_DATE" --venue "$VENUE" --times "$POST_TIMES" --phase early --push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkjc-shadow-early-${{ github.run_id }}
          path: race-day-data/${{ inputs.date }}/hkjc-early/
          retention-days: 7
  hkjc-release-late:
    if: inputs.mode == 'Run'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Hold until 90 minutes before the second half
        env:
          RACE_DATE: ${{ inputs.date }}
          POST_TIMES: ${{ inputs.post_times }}
        run: |
          python3 - <<'PY'
          import os,time
          from datetime import datetime,timedelta,timezone
          clocks=[s.strip() for s in os.environ['POST_TIMES'].split(',')]
          if not 1 <= len(clocks) <= 14:raise ValueError('Supply 1 to 14 official race times')
          parsed=[datetime.strptime(s,'%H:%M') for s in clocks]
          if any(b<=a for a,b in zip(parsed,parsed[1:])):raise ValueError('Race times must be increasing')
          if len(clocks)==1:raise SystemExit(0)
          cut=max(1,len(clocks)//2)
          hk=timezone(timedelta(hours=8))
          target=datetime.strptime(os.environ['RACE_DATE']+' '+clocks[cut],'%Y-%m-%d %H:%M').replace(tzinfo=hk)-timedelta(minutes=90)
          while datetime.now(hk)<target:
              time.sleep(min(30,(target-datetime.now(hk)).total_seconds()))
          PY
  hkjc-late:
    needs: hkjc-release-late
    if: inputs.mode == 'Run'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'playwright>=1.45,<2' certifi 'lxml>=5,<7'
      - run: python -m playwright install --with-deps chromium
      - name: Capture HKJC quotes and send independent T-3 tips
        env:
          RACE_DATE: ${{ inputs.date }}
          VENUE: ${{ inputs.venue }}
          POST_TIMES: ${{ inputs.post_times }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u race-day/hkjc_shadow.py --date "$RACE_DATE" --venue "$VENUE" --times "$POST_TIMES" --phase late --push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkjc-shadow-late-${{ github.run_id }}
          path: race-day-data/${{ inputs.date }}/hkjc-late/
          retention-days: 7

  report-failures:
    needs: [prepare, early, late, hkjc-early, hkjc-late]
    if: always() && inputs.mode == 'Run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'lxml>=5,<7'
      - env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          RACE_DATE: ${{ inputs.date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python race-day/auto_start.py --report-results
