name: Racing pattern checks
on:
  push:
    paths: ['tips-board/**', '.github/workflows/hv-pattern-check.yml']
  pull_request:
    paths: ['tips-board/**', '.github/workflows/hv-pattern-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: tips-data
          path: tips-data
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tips-board/requirements.txt
      - name: Frontend rules and settlement
        working-directory: tips-board
        run: |
          node --check app.mjs
          node --check strategies.mjs
          node test_strategy_page.mjs
          node test_strategy_history.mjs
          node test_roi_policy.mjs
          node test_pilot_model.mjs
          node --experimental-vm-modules test_roi_ui.cjs
          node --experimental-vm-modules test_strategy_history_ui.cjs
          node test_sha_tin_patterns.mjs
          node test_hv_patterns.mjs
          node test_manual.mjs
          node test_confidence_stats.mjs
          node test_settlement.mjs
      - name: Collector and pattern regression
        working-directory: tips-board
        run: python -m unittest test_hv_patterns test_collector test_sha_tin_patterns


